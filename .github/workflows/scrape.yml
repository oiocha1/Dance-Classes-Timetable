name: Scrape timetables

on:
  schedule:
    # Sundays at 06:17 Sydney time (AEDT). GitHub cron is UTC: Saturday 19:17.
    # During AEST (April-October) this lands at 05:17 instead, which is fine.
    - cron: "17 19 * * 6"
  workflow_dispatch: {}   # the dashboard's Refresh button (and "Run workflow") trigger this
  push:
    branches: [main]
    paths: ["docs/index.html", "scraper/**", ".github/workflows/scrape.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check name/level rules
        run: python scraper/test_normalise.py
        working-directory: .
        env:
          PYTHONPATH: scraper

      - name: Scrape studios
        run: python scraper/scrape.py

      - name: Save data.json to the repo
        run: |
          git config user.name "timetable-bot"
          git config user.email "timetable-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update timetable $(TZ=Australia/Sydney date '+%a %d %b %H:%M')"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
